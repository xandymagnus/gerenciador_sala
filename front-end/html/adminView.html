<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin View</title>
    <link rel="icon" href="../imagens/logo_icon.png">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/adminView.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
</head>
<body>
    <header>
        <div class="logo">
            <img src="../imagens/logo_css_branca.png" alt="logo">
            <h1 class="titulo">TELA DE ADMINISTRADOR</h1>
        </div>
    </header>

    <div class="container_acoes">
        <button id="addButton" type="click">Adicionar aula</button>
        <button id="view" type="click">Ver aulas</button>
    </div>

    <div class="overlay" id="overlay">
        <div id="addMenu" class="addMenu">
            <button class="sair" id="fechar-add-menu" type="click">X</button>

            <input type="text" placeholder="Curso" id="curso" class="curso" list="listaCurso">
            <datalist id="listaCurso">
                <option value="Genshin"></option>
            </datalist>

            <div class="disciplinaProfessor">
                <input type="text" placeholder="Disciplina" id="disciplina" class="disciplina" list="listaDisciplina" disabled>
                <datalist id="listaDisciplina"></datalist>    
                
                <input type="text" placeholder="Professor" id="professor" class="professor" list="listaProfessor" disabled>
                <datalist id="listaProfessor"></datalist>
            </div>

            <input type="text" placeholder="Dia" id="dia" class="dia" list="listaDia" disabled>
            <datalist id="listaDia"></datalist>

            <div class="salaHorario">
                <input type="text" placeholder="Sala" id="sala" class="sala" list="listaSala" disabled>
                <datalist id="listaSala"></datalist>
                
                <input type="time" placeholder="Horário" id="horarioInicio" class="horarioInicio" disabled>
                <input type="time" placeholder="Horário" id="horarioFim" class="horarioFim" disabled>
            </div>

            <button id="enviarAula" class="enviarAula" type="submit">Adicionar</button>
        </div>
    </div>

    <div class="overlay" id="overlay-view">

    <div class="modal-aulas">

        <button class="sair" id="fechar-view-menu">X</button>

        <h2>Lista de aulas</h2>

        <div class="barra-pesquisa">

            <input
                type="search"
                id="pesquisa-aula"
                placeholder="Pesquisar aula, professor, curso..."
            >

            <select id="filtro-curso">
                <option value="todos">Todos os cursos</option>
            </select>

        </div>

        <div id="lista-aulas" class="lista-aulas">

            <!-- JavaScript adiciona as aulas aqui -->

        </div>

    </div>

</div>

<div class="overlay" id="overlay-delete">

    <div class="modal-confirmacao">

        <h3>Excluir aula</h3>

        <p>
            Tem certeza que deseja excluir esta aula?
        </p>

        <div class="confirmacao-botoes">

            <button id="cancelar-exclusao">
                Cancelar
            </button>

            <button id="confirmar-exclusao" class="botao-vermelho">
                Excluir
            </button>

        </div>

    </div>

</div>

<div class="overlay" id="overlay-edit">

    <div class="addMenu">

        <button class="sair" id="fechar-edit">X</button>

        <h2>Editar aula</h2>

        <input type="hidden" id="editar-id">

        <input type="text" id="editar-curso" list="listaCurso">

        <div class="disciplinaProfessor">

            <input type="text" id="editar-disciplina" list="listaDisciplina">

            <input type="text" id="editar-professor" list="listaProfessor">

        </div>

        <input type="text" id="editar-dia" list="listaDia">

        <div class="salaHorario">
            <input type="text" id="editar-sala" list="listaSala">
            <input type="time" id="editar-horarioInicio">
            <input type="time" id="editar-horarioFim">
        </div>

        <button id="salvar-edicao">
            Salvar alterações
        </button>

    </div>

</div>

    <script src="../js/admin.js"></script>
</body>
</html>
